spring.application.name=docflow-backend
spring.datasource.url=jdbc:mysql://localhost:3306/docflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.map-underscore-to-camel-case=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Day 15：本地文件存储目录，在源码目录之外。
# 与 DocumentService 的 10 MB 业务限制口径一致（Spring 的 MB 也是 1024*1024 字节）。
# 想换目录不用改代码：设环境变量 DOCFLOW_STORAGE_DIR 即可，例如 D:/docflow-storage。
docflow.storage.dir=${DOCFLOW_STORAGE_DIR:D:/docflow-storage}