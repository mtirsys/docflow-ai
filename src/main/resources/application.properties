spring.application.name=docflow-backend
spring.datasource.url=jdbc:mysql://localhost:3306/docflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.map-underscore-to-camel-case=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Day 15：本地文件存储目录，在源码目录之外。
# 与 DocumentService 的 10 MB 业务限制口径一致（Spring 的 MB 也是 1024*1024 字节）。
# 想换目录不用改代码：设环境变量 DOCFLOW_STORAGE_DIR 即可，例如 D:/docflow-storage。
docflow.storage.dir=${DOCFLOW_STORAGE_DIR:D:/docflow-storage}

# Day 25：阿里云百炼 Embedding（OpenAI 兼容协议）。
# 与 DB_PASSWORD 同一安全策略：真实值只住环境变量，文件里只有占位符，可安全提交 Git。
# 注意：占位符无默认值，未设 DASHSCOPE_API_KEY / BAILIAN_WORKSPACE_ID 时应用启动即报错
# （故意的 fail-fast：Key 缺失越早发现越好，别等第一次调 API 才发现）。
spring.ai.openai.api-key=${DASHSCOPE_API_KEY}
spring.ai.openai.base-url=https://${BAILIAN_WORKSPACE_ID}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
# 2.0 属性已扁平化（没有 .options. 层级）。dimensions 显式写 1024：与模型默认一致，
# 但写出来更醒目，将来想换维度只改这一行。
spring.ai.openai.embedding.model=qwen3.7-text-embedding-flash
spring.ai.openai.embedding.dimensions=1024
spring.ai.openai.embedding.encoding-format=float

# Day 28：Qdrant 向量数据库连接（官方 Java 客户端走 gRPC，端口是 6334 不是 REST 的 6333）。
# 与 DB_PASSWORD 同一安全策略：真实值只住环境变量，本地默认值开发即用。
# - api-key：本地单机默认不需要（留空）；生产/Qdrant Cloud 必须设置；
# - collection：相当于"表名"，一个 collection 存同一种维度和距离度量的一批向量；
# - vector-dimension：建 collection 和写入前维度断言都用它。这里不写死 1024，
#   而是引用 spring.ai.openai.embedding.dimensions——单一事实源，
#   将来换 embedding 维度只改上面那一行，Qdrant 这边自动跟随，不会两边漂移。
docflow.qdrant.host=${QDRANT_HOST:localhost}
docflow.qdrant.port=${QDRANT_PORT:6334}
docflow.qdrant.api-key=${QDRANT_API_KEY:}
docflow.qdrant.collection=${QDRANT_COLLECTION:doc_chunks}
docflow.qdrant.use-tls=${QDRANT_USE_TLS:false}
docflow.qdrant.vector-dimension=${spring.ai.openai.embedding.dimensions}